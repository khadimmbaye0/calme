name: calme

services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-calme}
      - POSTGRES_USER=${POSTGRES_USER:-calme}
      - POSTGRES_PASSWORD
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - calme-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-calme}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-calme}
      - SPRING_DATASOURCE_PASSWORD
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  calme-db-data:
